spring:
  application:
    name: omega-gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

framework:
  gateway:
    token-secret: ${FRAMEWORK_GATEWAY_TOKEN_SECRET}
    allow-list:
      - method: POST
        path: /omega-authorization-service/login
      - path: /omega-cs-service/**


knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3
