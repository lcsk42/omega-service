spring:
  application:
    name: omega-file-service
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:nacos}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:nacos}


management:
  endpoints:
    web:
      exposure:
        include: "*"

framework:
  log:
    access-log:
      enabled: true
    includes: all
  database:
    mybatis-plus:
      mapper-package: com.lcsk42.biz.file.mapper
      pagination:
        db-type: mysql
  file:
    upload:
      file-upload-type: aws_s3
      endpoint: ${FRAMEWORK_FILE_UPLOAD_ENDPOINT}
      access-key-id: ${FRAMEWORK_FILE_UPLOAD_ACCESS_KEY_ID}
      access-key-secret: ${FRAMEWORK_FILE_UPLOAD_ACCESS_KEY_SECRET}
      bucket-name: ${FRAMEWORK_FILE_UPLOAD_BUCKET_NAME}
      region: ${FRAMEWORK_FILE_UPLOAD_REGION}
      extra:
        public-bucket-name: lcsk42-public
  api-doc:
    name: File
    description: 文件管理
    version: 1.0.0
    contact:
      name: lcsk42
      email: lcsk42@gmail.com
      url: https://lcsk42.com
    license:
      name: MIT